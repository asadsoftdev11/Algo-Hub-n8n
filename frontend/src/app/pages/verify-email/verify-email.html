<div class="grid min-h-screen lg:grid-cols-[2fr_3fr]">
  <app-auth-panel />
  <div class="flex items-center justify-center bg-gradient-to-br from-white to-emerald-50/70 px-4 sm:px-10">
    <div class="w-full max-w-lg py-10 text-center">
      <a routerLink="/" class="mb-6 block text-2xl font-bold text-emerald-700 lg:hidden">AutoSocial AI</a>

      <div class="pop mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-emerald-700">
        <svg viewBox="0 0 24 24" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
      </div>

      <h1 class="mt-5 text-2xl font-bold text-slate-900">Check your email</h1>
      <p class="mt-2 text-sm text-slate-600">
        We sent a confirmation link to
        <span class="font-semibold text-slate-800">{{ email }}</span>.
        Open it to finish setting up your account.
      </p>

      <button
        (click)="resend()"
        [disabled]="wait() > 0 || sending()"
        class="shine mt-6 rounded-lg bg-emerald-600 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ wait() > 0 ? 'Resend in ' + wait() + 's' : sending() ? 'Sending...' : 'Resend email' }}
      </button>

      <p class="mt-6 text-xs text-slate-500">Cannot find it? Check your spam folder.</p>
      <a routerLink="/signin" class="mt-4 inline-block text-sm font-semibold text-emerald-700 hover:underline">Back to sign in</a>
    </div>
  </div>
</div>
