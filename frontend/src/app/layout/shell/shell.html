<div class="flex min-h-screen bg-slate-50">
  <aside class="hidden md:block w-64 bg-white border-r border-slate-200 p-5">
    <h1 class="text-xl font-bold text-violet-600 mb-8">AutoPost AI</h1>
    <nav class="space-y-1">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-violet-50 text-violet-700"
          class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="flex-1 flex flex-col">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">
      <span class="text-sm text-slate-500">Welcome back</span>
      <div class="flex items-center gap-3">
        <span class="text-xs font-medium rounded-full bg-violet-100 text-violet-700 px-3 py-1">Free plan</span>
        <div class="h-9 w-9 rounded-full bg-violet-600 text-white flex items-center justify-center text-sm font-semibold">A</div>
      </div>
    </header>

    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
