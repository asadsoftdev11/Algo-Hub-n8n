<div class="flex min-h-screen bg-slate-50">
  <aside class="hidden md:flex w-64 flex-col bg-white border-r border-slate-200 p-5">
    <a routerLink="/" class="text-xl font-bold text-emerald-700 mb-8">AutoSocial AI</a>
    <nav class="space-y-1 flex-1">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-emerald-50 text-emerald-700"
          class="flex items-center justify-between rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          {{ link.label }}
          @if (link.paidOnly && !auth.isSubscribed()) {
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold uppercase text-slate-500">Locked</span>
          }
        </a>
      }
    </nav>
    <button (click)="logout()" class="text-left text-sm font-medium text-slate-500 hover:text-emerald-700">Log out</button>
  </aside>

  <div class="flex-1 flex flex-col">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">
      <span class="text-sm text-slate-500">Welcome, {{ auth.user()?.name }}</span>
      <div class="flex items-center gap-3">
        <span
          class="text-xs font-medium rounded-full px-3 py-1"
          [class]="auth.isSubscribed() ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
        >{{ planLabel }}</span>
        <div class="h-9 w-9 rounded-full bg-emerald-600 text-white flex items-center justify-center text-sm font-semibold">{{ initial }}</div>
      </div>
    </header>

    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
