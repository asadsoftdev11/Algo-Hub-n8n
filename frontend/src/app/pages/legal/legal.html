<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-6">
    <a routerLink="/" class="text-xl font-bold text-emerald-700">AutoSocial AI</a>
    <a routerLink="/" class="text-sm font-medium text-slate-600 hover:text-emerald-700">Back to home</a>
  </div>
</header>

<main class="mx-auto max-w-3xl px-6 py-12">
  <h1 class="text-3xl font-extrabold text-slate-900">{{ doc.title }}</h1>
  <p class="mt-2 text-sm text-slate-500">Last updated: November 2026</p>

  @for (s of doc.sections; track s.heading) {
    <h2 class="mt-8 text-lg font-bold text-slate-900">{{ s.heading }}</h2>
    <p class="mt-2 leading-relaxed text-slate-600">{{ s.text }}</p>
  }

  <p class="mt-10 text-sm text-slate-500">Questions? Contact us at {{ contactEmail }}.</p>
</main>
