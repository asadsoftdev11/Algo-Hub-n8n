<div class="flex min-h-screen items-center justify-center bg-emerald-50 px-4">
  <div class="w-full max-w-md">
    <a routerLink="/" class="mb-6 block text-center text-2xl font-bold text-emerald-700">AutoSocial AI</a>
    <div class="rounded-2xl border border-emerald-100 bg-white p-8 shadow-xl">
      @if (sent()) {
        <h1 class="text-2xl font-bold text-slate-900">Check your email</h1>
        <p class="mt-2 text-sm text-slate-600">
          If an account exists for {{ email }}, we have sent a link to reset your password.
        </p>
        <a routerLink="/signin" class="mt-6 block rounded-lg bg-emerald-600 py-2.5 text-center font-semibold text-white hover:bg-emerald-700">
          Back to sign in
        </a>
      } @else {
        <h1 class="text-2xl font-bold text-slate-900">Reset your password</h1>
        <p class="mt-1 text-sm text-slate-500">Enter your email and we will send you a reset link.</p>
        <form #f="ngForm" (ngSubmit)="submit()" class="mt-6 space-y-4">
          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
            <input name="email" type="email" required [(ngModel)]="email" placeholder="you@example.com"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <button type="submit" [disabled]="f.invalid || sending()"
            class="w-full rounded-lg bg-emerald-600 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
            {{ sending() ? 'Sending...' : 'Send reset link' }}
          </button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-600">
          <a routerLink="/signin" class="font-semibold text-emerald-700">Back to sign in</a>
        </p>
      }
    </div>
  </div>
</div>
