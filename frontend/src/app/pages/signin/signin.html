<div class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-emerald-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <a routerLink="/" class="block text-center text-2xl font-bold text-emerald-700 mb-6">AutoSocial AI</a>
    <div class="rounded-xl border border-emerald-100 bg-white p-8 shadow-xl">
      <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
      <p class="mt-1 text-sm text-slate-500">Sign in to continue to your dashboard.</p>

      <form #f="ngForm" (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
          <input name="email" type="email" required [(ngModel)]="email" placeholder="you@example.com"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
          <input name="password" type="password" required [(ngModel)]="password" placeholder="Your password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div class="text-right">
          <a routerLink="/forgot-password" class="text-sm font-semibold text-emerald-700 hover:underline">Forgot password?</a>
        </div>
          @if (errorMessage()) {
          <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
        }
        <button type="submit" [disabled]="f.invalid"
          class="w-full rounded-lg bg-emerald-600 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
          Sign in
        </button>
      </form>
    </div>
    <p class="mt-6 text-center text-sm text-slate-600">
      New here? <a routerLink="/signup" class="font-semibold text-emerald-700">Create an account</a>
    </p>
  </div>
</div>
