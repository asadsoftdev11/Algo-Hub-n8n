<div class="grid min-h-screen lg:grid-cols-[2fr_3fr]">
  <app-auth-panel />
  <div class="flex items-center justify-center bg-gradient-to-br from-white to-emerald-50/70 px-4 sm:px-10">
    <div class="w-full max-w-lg">
      <a routerLink="/" class="block text-center text-2xl font-bold text-emerald-700 mb-6 lg:hidden">AutoSocial AI</a>
      <div class="p-2 sm:p-4">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Welcome back</h1>
        <p class="mt-1 text-sm text-slate-500">Sign in to continue to your dashboard.</p>

        <form #f="ngForm" (ngSubmit)="submit()" class="mt-6 space-y-4">
          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
            <input name="email" type="email" autocomplete="email" required [(ngModel)]="email" placeholder="you@example.com"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
            <app-password-field>
            <input name="password" type="password" autocomplete="current-password" required [(ngModel)]="password" placeholder="Your password"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
              </app-password-field>
          </div>
          <div class="text-right">
            <a routerLink="/forgot-password" class="text-sm font-semibold text-emerald-700 hover:underline">Forgot
              password?</a>
          </div>
          @if (errorMessage()) {
          <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
          }
          <button type="submit" [disabled]="f.invalid || busy()"
            class="shine w-full rounded-lg bg-emerald-600 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
            Sign in
          </button>
        </form>
      </div>
      <p class="mt-6 text-center text-sm text-slate-600">
        New here? <a routerLink="/signup" class="font-semibold text-emerald-700">Create an account</a>
      </p>
    </div>
  </div>
</div>
