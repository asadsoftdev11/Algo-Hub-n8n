<div class="grid min-h-screen lg:grid-cols-[2fr_3fr]">
  <app-auth-panel art="prism" />
  <div class="flex items-center justify-center bg-gradient-to-br from-white to-emerald-50/70 px-4 sm:px-10">
    <div class="w-full max-w-lg p-2 sm:p-4">
      <a routerLink="/" class="mb-6 block text-center text-2xl font-bold text-emerald-700 lg:hidden">AutoSocial AI</a>
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Choose a new password</h1>
      <p class="mt-1 text-sm text-slate-500">Use at least 8 characters.</p>

      <form (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">New password</label>
         <app-password-field>
          <input name="password" type="password" autocomplete="new-password" [(ngModel)]="password" placeholder="At least 8 characters"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </app-password-field> 
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Confirm new password</label>
          <app-password-field>
          <input name="confirm" type="password" autocomplete="new-password" [(ngModel)]="confirm" placeholder="Repeat your password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </app-password-field>
          @if (mismatch) {
            <p class="mt-1 text-xs text-red-600">Passwords do not match.</p>
          }
        </div>

        @if (errorMessage()) {
          <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="!canSubmit"
          class="shine w-full rounded-lg bg-emerald-600 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
          {{ saving() ? 'Saving...' : 'Update password' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-600">
        <a routerLink="/signin" class="font-semibold text-emerald-700">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
