<div class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-emerald-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <a routerLink="/" class="block text-center text-2xl font-bold text-emerald-700 mb-6">AutoSocial AI</a>
    <div class="rounded-xl border border-emerald-100 bg-white p-8 shadow-xl">
      <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
      <p class="mt-1 text-sm text-slate-500">Start publishing with one prompt. Free to begin.</p>

      <form #f="ngForm" (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Full name</label>
          <input name="fullName" type="text" required [(ngModel)]="fullName" placeholder="Your name"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Business or brand (optional)</label>
          <input name="company" type="text" [(ngModel)]="company" placeholder="Your business name"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
          <input name="email" type="email" required [(ngModel)]="email" placeholder="you@example.com"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
          <input name="password" type="password" required minlength="8" [(ngModel)]="password" placeholder="At least 8 characters"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Confirm password</label>
          <input name="confirm" type="password" required [(ngModel)]="confirm" placeholder="Repeat your password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          @if (mismatch) {
            <p class="mt-1 text-xs text-red-600">Passwords do not match.</p>
          }
        </div>
        <label class="flex items-start gap-2 text-sm text-slate-600">
          <input name="agree" type="checkbox" required [(ngModel)]="agree" class="mt-1 accent-emerald-600" />
                   <span>
            I agree to the
            <a routerLink="/terms" target="_blank" class="font-semibold text-emerald-700 hover:underline">Terms</a>
            and
            <a routerLink="/privacy" target="_blank" class="font-semibold text-emerald-700 hover:underline">Privacy Policy</a>.
          </span>
        </label>
          @if (errorMessage()) {
          <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
        }
        <button type="submit" [disabled]="f.invalid || mismatch"
          class="w-full rounded-lg bg-emerald-600 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
          Create account
        </button>
      </form>
    </div>
    <p class="mt-6 text-center text-sm text-slate-600">
      Already have an account? <a routerLink="/signin" class="font-semibold text-emerald-700">Sign in</a>
    </p>
  </div>
</div>
